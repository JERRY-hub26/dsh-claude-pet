<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: file:; style-src 'unsafe-inline' 'self'; script-src 'self'"
    />
    <title>Claude Pet</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <div id="stage">
      <div id="pet" class="hit" title="">
        <div class="shadow"></div>
        <div class="shift">
          <div class="sway">
            <div class="bob">
              <div id="figure" class="figure" data-mode="idle"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="bubble" class="hit" hidden>
        <div id="bubbleText"></div>
        <div id="bubbleSub" hidden></div>
      </div>

      <div id="menu" hidden></div>
    </div>
    <script src="./lines.js"></script>
    <script src="./pet.js"></script>
  </body>
</html>
